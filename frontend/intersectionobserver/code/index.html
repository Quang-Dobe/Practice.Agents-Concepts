<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IntersectionObserver — MVP</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
      #feed { width: 50%; padding: 16px; }
      .card { height: 120px; margin-bottom: 16px; display: grid; place-items: center; background: #333; border-radius: 8px; }
      .card.loaded { background: #2e7d32; color: #fff; }
      #sentinel { width: 50%; height: 1px; }
      #log { position: fixed; top: 0; right: 0; width: 45%; height: 100vh; margin: 0; padding: 12px;
             overflow: auto; box-sizing: border-box; background: #000; color: #8f8; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="feed"></div>
    <div id="sentinel"></div>
    <pre id="log"></pre>
    <script type="module" src="/mvp.ts"></script>
  </body>
</html>
