name: Email Claude learning summary

on:
  push:
    branches: [main]

jobs:
  send-email:
    if: startsWith(github.event.head_commit.message, '[CLAUDE] [')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify TOPIC_SUMMARIZATION.md exists
        run: |
          if [ ! -f TOPIC_SUMMARIZATION.md ]; then
            echo "TOPIC_SUMMARIZATION.md not found at repo root — refusing to send empty email."
            exit 1
          fi

      - name: Prepare subject and body
        id: prep
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          SUBJECT=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -n 1)
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

          # Derive the live presentation-site URL for this topic's landing page.
          # TOPIC_SUMMARIZATION.md ends with:  Full notes: https://github.com/<owner>/<repo>/tree/main/<category>/<slug>/
          # Turn that into the GitHub Pages URL of the topic's present/index.html.
          PRESENT_URL=""
          NOTES=$(grep -oE 'https://github\.com/[^ ]+/tree/main/[^ ]+' TOPIC_SUMMARIZATION.md | head -n1 || true)
          if [ -n "$NOTES" ]; then
            NOTES="${NOTES%/}"                         # strip trailing slash
            REST="${NOTES#https://github.com/}"        # <owner>/<repo>/tree/main/<cat>/<slug>
            OWNER="${REST%%/*}"                         # <owner>
            REST2="${REST#*/}"                          # <repo>/tree/main/<cat>/<slug>
            REPO="${REST2%%/*}"                         # <repo>
            TOPIC_PATH="${REST2#*/tree/main/}"          # <cat>/<slug>
            OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            if [ -f "$TOPIC_PATH/present/index.html" ]; then
              PRESENT_URL="https://${OWNER_LC}.github.io/${REPO}/${TOPIC_PATH}/present/index.html"
            fi
          fi

          {
            echo "body<<__EOF__"
            if [ -n "$PRESENT_URL" ]; then
              echo "Read it on the site:"
              echo "$PRESENT_URL"
              echo ""
            fi
            cat TOPIC_SUMMARIZATION.md
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Send email via Gmail SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USERNAME }}
          to: tdquangcr@gmail.com
          subject: ${{ steps.prep.outputs.subject }}
          body: ${{ steps.prep.outputs.body }}
